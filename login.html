<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Acceso - Polideportivo</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <h1>Polideportivo Municipal</h1>
        <nav>
            <ul>
                <li><a href="index.html">Inicio</a></li>
                <li><a href="catalogo.html">Instalaciones</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h2>Acceso de Usuarios</h2>
        <div class="alerta-prototipo">
            <strong>Aviso:</strong> Se trata de una demostración sin autenticación real. No introduzcas datos reales.
        </div>
        <form action="catalogo.html" method="GET">
            <fieldset>
                <legend>Tus credenciales</legend>
                <div class="campo">
                    <label for="correo">Correo electrónico:</label>
                    <input type="email" id="correo" name="correo" required>
                </div>
                <div class="campo">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn">Acceder</button>
            </fieldset>
        </form>
    </main>
</body>

</html>
