<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Solicitar Reserva</title>
    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
    <header>
        <h1>Formulario de Reserva</h1>
        <nav><a href="carrito.html">Volver a Mi Selección</a></nav>
    </header>
    <main>
        <div class="alerta-prototipo">
            Prototipo: El envío de datos es una simulación.
        </div>
        <form action="index.html" method="GET">
            <fieldset>
                <legend>Datos Personales</legend>

                <div class="campo">
                    <label for="nombre">Nombre completo (Requerido):</label>
                    <input type="text" id="nombre" name="nombre" required>
                </div> <!-- 1. Campo de texto -->

                <div class="campo">
                    <label for="correo">Correo electrónico (Requerido):</label>
                    <input type="email" id="correo" name="correo" required>
                </div> <!-- 2. Campo de correo -->

                <div class="campo">
                    <label for="telefono">Teléfono de contacto:</label>
                    <input type="tel" id="telefono" name="telefono" pattern="[0-9]{9}" title="Debe contener 9 números">
                </div> <!-- 3. Campo extra (teléfono) -->
            </fieldset>

            <fieldset>
                <legend>Detalles de la Reserva</legend>

                <div class="campo">
                    <label for="deporte">Deporte a practicar:</label>
                    <select id="deporte" name="deporte">
                        <option value="futsal">Fútbol Sala</option>
                        <option value="f7">Fútbol 7</option>
                        <option value="padel">Pádel</option>
                    </select>
                </div> <!-- 4. Desplegable select -->

                <div class="campo">
                    <label for="fecha">Fecha de reserva (Requerido):</label>
                    <input type="date" id="fecha" name="fecha" required min="2026-11-06">
                </div> <!-- 5. Campo extra (fecha) -->

                <div class="campo">
                    <label>Nivel de juego de los participantes:</label>
                    <div>
                        <input type="radio" id="nivel_iniciacion" name="nivel" value="iniciacion" checked>
                        <label for="nivel_iniciacion">Iniciación</label>

                        <input type="radio" id="nivel_amateur" name="nivel" value="amateur">
                        <label for="nivel_amateur">Amateur</label>
                    </div>
                </div> <!-- 6. Grupo de botones de opción (radio) -->

                <div class="campo">
                    <label for="comentarios">Peticiones especiales (material adicional):</label>
                    <textarea id="comentarios" name="comentarios" rows="4"></textarea>
                </div> <!-- 7. Área de texto -->
            </fieldset>

            <fieldset>
                <legend>Confirmación</legend>
                <div class="campo">
                    <div>
                        <input type="checkbox" id="condiciones" name="condiciones" required>
                        <label for="condiciones">Acepto las normas de uso de las instalaciones municipales
                            (Requerido)</label>
                    </div>
                </div> <!-- 8. Casilla de verificación -->
            </fieldset>

            <button type="submit" class="btn">Solicitar reserva</button>
        </form>
    </main>
</body>

</html>
